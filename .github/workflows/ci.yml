name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` runs the same tsc over the same three workspaces that
      # `typecheck` does, only with emit, so running both was a duplicate pass.
      # Worth a couple of seconds rather than a lot — this job's time is npm ci
      # and the suites — but it moves before the tests so a type error still
      # reports as a type error rather than as a confusing test failure.
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flightmap
          POSTGRES_PASSWORD: flightmap
          POSTGRES_DB: flightmap_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=flightmap --dbname=flightmap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FLIGHTMAP_TEST_DATABASE_URL: postgres://flightmap:flightmap@127.0.0.1:5432/flightmap_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The repository's SQL — migrations, ingestion, retention, insights — runs
      # against a real PostgreSQL here; the unit suites only assert on strings.
      - run: npm run test:integration

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately not `needs: verify`. This is the longest job in the run, and
    # gating it on a 1m20s lint-and-typecheck job put that time on the critical
    # path for no information — a lint failure fails the run whether or not the
    # browser suite also ran. Running them together is the difference between a
    # ~5m and a ~3m answer.
    env:
      POSTGRES_PASSWORD: flightmap-ci-database-password
      DATABASE_URL: postgresql://flightmap:flightmap-ci-database-password@db:5432/flightmap
      RECEIVER_BASE_URL: http://fake-receiver:8081/data
      APP_ALLOWED_HOSTS: 127.0.0.1,localhost
      METADATA_UPDATES_ENABLED: "false"
      FAKE_RECEIVER_AIRCRAFT_COUNT: "250"
      FLIGHTMAP_FAKE_RECEIVER_URL: http://127.0.0.1:8081
      # The end-to-end run and the load smoke reach the server from the same
      # address, so they share one rate-limit bucket. At the interactive default
      # of 300/minute the load smoke spent its budget on Playwright's traffic and
      # measured the limiter rather than the server. These values apply to the
      # test stack only; docker-compose.yml keeps the shipped defaults.
      API_RATE_LIMIT: "100000"
      MUTATION_RATE_LIMIT: "100000"
      WEBSOCKET_RATE_LIMIT: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Deliberately not --with-deps: the runner image already ships Chromium's
      # shared libraries, and the apt payload is font packages these tests never
      # render. A degraded Azure mirror once made that step take 10m38s of a
      # 12m47s job, against ~10s for the browser download alone.
      - run: npx playwright install chromium
      # Left as an uncached build on purpose. It takes 38s of this job's 218s,
      # and a GHA layer cache would trade most of that for downloading a cache
      # of a 390 MB image — plausibly a wash, and a new way for the job to fail.
      # The time here is npm run test:e2e, not this.
      - run: docker compose --profile testing up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Configure deterministic fake receiver
        run: |
          curl --fail --silent --show-error \
            --request PATCH http://127.0.0.1:8080/api/v1/settings \
            --header 'content-type: application/json' \
            --header 'origin: http://127.0.0.1:8080' \
            --data '{"receiverBaseUrl":"http://fake-receiver:8081/data","pollIntervalMs":1000,"receiverStatsIntervalMs":10000,"metadataUpdatesEnabled":false}'
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/aircraft/live | grep --quiet '"icao":"400001"'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs app fake-receiver
          exit 1
      - run: npm run test:e2e
      - run: npm run test:load
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose --profile testing down --volumes
