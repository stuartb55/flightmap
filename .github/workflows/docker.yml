name: Docker image

on:
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - ".dockerignore"
      - "infra/Dockerfile"
      - "infra/docker-entrypoint.sh"
      - "infra/healthcheck.mjs"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the commit-addressed image to GHCR
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  PUBLISH_IMAGE: >-
    ${{
      github.event_name == 'workflow_run' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    }}

jobs:
  build:
    name: Build multi-platform image
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      # Only needed to emulate arm64, which only a publishing build produces.
      - name: Set up QEMU
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=raw,value=sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile
          # A pull request builds amd64 only. The arm64 half is emulated under
          # QEMU and is the larger part of a 73s build plus 8s of QEMU setup.
          # What it re-proves each time is that the per-target stage installs
          # cleanly on arm64 — and all 99 of the server's production packages
          # are pure JavaScript with no binding.gyp, os/cpu constraint or
          # install script between them, which `--ignore-scripts` there would
          # not run anyway. Every published image — main, tags, manual dispatch
          # — is still built for both, so a genuine cross-architecture break is
          # caught on merge rather than on release.
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=flightmap-app
          # `ignore-error`, because the cache is an optimisation and failing to
          # export one is not a reason to fail an image that built. Re-running
          # this workflow for a pull request that has since merged does exactly
          # that: GitHub tears the merge ref's cache scope down with the pull
          # request, so the export fails with `error writing layer blob: failed
          # to reserve cache` on a build that produced a working image.
          cache-to: type=gha,mode=max,ignore-error=true,scope=flightmap-app
          provenance: mode=max
          sbom: true
