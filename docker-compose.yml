name: flightmap

services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightmap}
      POSTGRES_USER: ${POSTGRES_USER:-flightmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: UTC
      PGTZ: UTC
    volumes:
      - flightmap-db:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-flightmap}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flightmap}}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "infra/healthcheck.mjs", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

  fake-receiver:
    profiles: ["testing"]
    build:
      context: ./infra/fake-receiver
    environment:
      PORT: ${FAKE_RECEIVER_PORT:-8081}
      RECEIVER_LAT: ${FAKE_RECEIVER_LAT:-53.61}
      RECEIVER_LON: ${FAKE_RECEIVER_LON:--2.31}
      AIRCRAFT_COUNT: ${FAKE_RECEIVER_AIRCRAFT_COUNT:-3}
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend:
    internal: false

volumes:
  flightmap-db:
